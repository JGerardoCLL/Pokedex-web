<main class="pokdx">
  <div class="pokdx__container">
    <header class="pokdx__header">
      <h1 class="pokdx__title">Pokédex</h1>
      <button type="button" class="pokdx__button" routerLink="/favoritos">Favoritos ♥</button>
    </header>

    <section class="pokdx__filters">
      <input
        id="search"
        class="pokdx__search"
        type="search"
        placeholder="Buscar por nombre o número..."
        [(ngModel)]="searchTerm"
        (input)="search()"
      />

      <select
        id="type"
        class="pokdx__type-select"
        [(ngModel)]="selectedType"
        (change)="filterByType()">
        <option value="">Tipo: Todos</option>
        <option *ngFor="let type of types" [value]="type">
          {{ type }}
        </option>
      </select>
    </section>

    <section class="pokdx__content">
      <a
        class="pokdx__card"
        *ngFor="let poke of paginatedPokemon"
        [routerLink]="['/detalles', poke.id]">
        <img
          class="pokdx__image"
          [src]="'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' + poke.id + '.png'"
          [alt]="poke.name"
        />

        <p class="pokdx__number">#{{ poke.id | number: '3.0-0' }}</p>
        <h2 class="pokdx__name">{{ poke.name }}</h2>
        <span
          class="pokdx__type"
          [ngClass]="'pokdx__type--' + poke.type.toLowerCase()">
          {{ poke.type }}
        </span>
      </a>
    </section>

    <p *ngIf="filteredPokemon.length === 0">
      No se encontraron Pokémon.
    </p>

    <nav
      class="pokdx__pagination"
      *ngIf="totalPages > 1"
      aria-label="Paginación">

      <button
        type="button"
        (click)="previousPage()"
        [disabled]="currentPage === 1">
        Anterior
      </button>

      <span>
        Página {{ currentPage }} de {{ totalPages }}
      </span>

      <button
        type="button"
        (click)="nextPage()"
        [disabled]="currentPage === totalPages">
        Siguiente
      </button>
    </nav>
  </div>
</main>
